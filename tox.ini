[tox]
envlist = py35,py36,py37,lint,minimal,isort-check
[testenv]
deps=
  pytest
  pytest-coverage
  dataclasses
commands=pytest --cov={envsitepackagesdir}/valuable --cov-branch --cov-fail-under 100
[testenv:minimal]
deps=pytest
commands=pytest
[testenv:py35]
deps=pytest
commands=pytest
[testenv:lint]
skip_install=True
deps=flake8
commands=flake8 valuable tests
[testenv:isort-check]
skip_install=True
deps=isort
commands=isort -rc -c valuable

[coverage:run]
branch=True
[coverage:report]
exclude_lines=
  pragma: no cover
  raise NotImplementedError
